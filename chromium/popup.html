<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { width: 340px; margin: 0; background: #0b1220; color: #e2e8f0;
         font: 13px/1.45 system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 14px;
           border-bottom: 1px solid #1e293b; }
  header h1 { margin: 0; font-size: 14px; letter-spacing: .4px; flex: 1; }
  .sw { width: 40px; height: 22px; border-radius: 99px; background: #334155; position: relative;
        cursor: pointer; transition: background .15s; flex: none; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
               border-radius: 50%; background: #94a3b8; transition: .15s; }
  .sw.on { background: #15803d; }
  .sw.on::after { left: 21px; background: #fff; }
  .off { opacity: .45; pointer-events: none; }
  #banner { padding: 10px 14px; font-size: 12px; color: #fca5a5; background: #1c1017;
            border-bottom: 1px solid #3f1d1d; display: none; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: #1e293b; }
  .cell { background: #0b1220; padding: 10px 8px; text-align: center; }
  .cell b { display: block; font-size: 17px; color: #f7d77a; }
  .cell span { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: .5px; }
  section { padding: 12px 14px; border-top: 1px solid #1e293b; }
  label.row { display: flex; align-items: center; justify-content: space-between;
              gap: 10px; margin: 7px 0; font-size: 12px; color: #cbd5e1; }
  select { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px;
           padding: 3px 6px; font: 12px system-ui; }
  input[type=range] { width: 120px; accent-color: #f7d77a; }
  #log { max-height: 130px; overflow-y: auto; font: 11px/1.6 ui-monospace, monospace;
         color: #94a3b8; }
  #log div { display: flex; gap: 8px; border-bottom: 1px solid #131c2b; padding: 2px 0; }
  #log time { color: #475569; flex: none; }
  button.reset { width: 100%; margin-top: 10px; padding: 8px; border: 0; border-radius: 7px;
                 background: #1e293b; color: #cbd5e1; font: 600 12px system-ui; cursor: pointer; }
  button.reset:hover { background: #334155; }
</style>
</head>
<body>
<header>
  <h1>Muter</h1>
  <div id="sw" class="sw"></div>
</header>
<div id="banner">Open class.nims.com.np to use Muter.</div>

<div class="grid">
  <div class="cell"><b id="c-copy">0</b><span>copy</span></div>
  <div class="cell"><b id="c-cut">0</b><span>cut</span></div>
  <div class="cell"><b id="c-paste">0</b><span>paste</span></div>
  <div class="cell"><b id="c-chars">0</b><span>chars</span></div>
  <div class="cell"><b id="c-warn">0</b><span>warn api</span></div>
  <div class="cell"><b id="c-drop">0</b><span>dropped</span></div>
</div>

<section id="settings">
  <label class="row">Type pastes as keystrokes <div class="sw" id="s-typePaste"></div></label>
  <label class="row">Gate warning API <div class="sw" id="s-gate"></div></label>
  <label class="row">Tab switch
    <select id="s-tab">
      <option value="drop">drop</option>
      <option value="send">send</option>
      <option value="ask">ask</option>
    </select>
  </label>
  <label class="row">Other warnings
    <select id="s-other">
      <option value="drop">drop</option>
      <option value="send">send</option>
      <option value="ask">ask</option>
    </select>
  </label>
  <label class="row">Typing delay <input type="range" id="s-delay" min="5" max="120" step="1"></label>
  <label class="row">Block metrics sync <div class="sw" id="s-sync"></div></label>
  <label class="row">Report tab as always visible <div class="sw" id="s-visible"></div></label>
  <label class="row">Hide site warning popup <div class="sw" id="s-modal"></div></label>
  <label class="row">Hide site warning panel <div class="sw" id="s-banner"></div></label>
</section>

<section>
  <div id="log"></div>
  <button class="reset" id="reset">Reset counters and log</button>
</section>

<script src="popup.js"></script>
</body>
</html>
